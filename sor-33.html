<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html>
<head>
<title>SoR Memory Game</title>
<link rel="stylesheet" href="../sor-game/css/sor-game.css"/>
<script src="../sor-game/js/jquery-1.11.3.min.js"></script>

<style type="text/css">
	table {
		margin: 0px 20px 50px 20px;
	}
	th{
		font-size:32px;
	}
	td {
		padding: 12px;
	}
	img {
		width: 80px;
	}
	button {
		border: 0px;
    padding: 10px 30px;
    border-radius: 12px;
    font-size: 24px;
    cursor: pointer;
    background-color: #5f78dc89;
    margin: 40px 250px;
	}
	div{
		margin: 20px;
		font-size: 32px;
	}

</style>

</head>
<body style="background: #fff0" >	
	<div>
		<button onclick="startGame();">Random</button>
		<div>吐捲舌練習</div>
		<section id="threeTable">		
		</section>			
		<button onclick="startGame();">Random</button>
		<div>吐捲五言詩</div>
		<section id="fiveTable">	
		</section>			
		<button onclick="startGame();">Random</button>
		<div>吐捲七言詩</div>
		<section id="sevenTable">	
		</section>			
	</div>
	
<script>

$(document).ready(function() {	
	startGame() 
});

function startGame() {
	var threeTableHtml = "<table>";
	for(var i=0 ;i<4 ; i++) {
		threeTableHtml = threeTableHtml + "<tr>";
		for(var j=0 ;j<6 ; j++) {
			if(i==0) {
				var sn = j+1;
				threeTableHtml = threeTableHtml + "<th>"+sn+"</th>";
			} else {
				let randomNum = Math.random() < 0.5 ? 1 : 2;
				var imageName = "andy-"+randomNum+".png"
				threeTableHtml = threeTableHtml + "<td><img src='../sor-game/image/33/"+ imageName +"'/></td>";
			}
		
		}
		threeTableHtml = threeTableHtml + "</tr>";
	}
	threeTableHtml = threeTableHtml + "</table>";
	$("#threeTable").html(threeTableHtml);		


	var fiveTableHtml = "<table>";
	for(var i=0 ;i<4 ; i++) {
		fiveTableHtml = fiveTableHtml + "<tr>";
		for(var j=0 ;j<7 ; j++) {
			if(j==0) {
				var sn = i+1;
				fiveTableHtml = fiveTableHtml + "<th>"+sn+"</th>";
			} else if (j==3) {
				fiveTableHtml = fiveTableHtml + "<td style='width:30px'></td>";
			} else {
				let randomNum = Math.random() < 0.5 ? 1 : 2;
				var imageName = "andy-"+randomNum+".png"
				fiveTableHtml = fiveTableHtml + "<td><img src='../sor-game/image/33/"+ imageName +"'/></td>";
			}
		
		}
		fiveTableHtml = fiveTableHtml + "</tr>";
	}
	fiveTableHtml = fiveTableHtml + "</table>";
	$("#fiveTable").html(fiveTableHtml);		

	var sevenTableHtml = "<table>";
	for(var i=0 ;i<4 ; i++) {
		sevenTableHtml = sevenTableHtml + "<tr>";
		for(var j=0 ;j<10 ; j++) {
			if(j==0) {
				var sn = i+1;
				sevenTableHtml = sevenTableHtml + "<th>"+sn+"</th>";
			} else if (j==3) {
				sevenTableHtml = sevenTableHtml + "<td style='width:30px'></td>";
			}else if (j==6) {
				sevenTableHtml = sevenTableHtml + "<td style='width:30px'></td>";
			} else {
				let randomNum = Math.random() < 0.5 ? 1 : 2;
				var imageName = "andy-"+randomNum+".png"
				sevenTableHtml = sevenTableHtml + "<td><img src='../sor-game/image/33/"+ imageName +"'/></td>";
			}
		}
		sevenTableHtml = sevenTableHtml + "</tr>";
	}
	sevenTableHtml = sevenTableHtml + "</table>";
	$("#sevenTable").html(sevenTableHtml);
}


</script>
</body>
</html>
